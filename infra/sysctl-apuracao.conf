# /etc/sysctl.d/99-apuracao.conf  →  sudo sysctl --system
# Sem isso o WS morre entre 1 e 4 mil conexões. Só sobe limites: seguro numa máquina dividida (a da OVH tem o hub).
fs.file-max = 2097152
fs.nr_open = 2097152
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535
# portas de saída (nginx → workers em 127.0.0.1): ~55 mil por destino. Começa em 10240 para não pegar porta de
# serviço local (3000, 3306, 8090...); 33060 (MySQL X) fica reservada
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.ip_local_reserved_ports = 33060
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
# memória total de TCP, em páginas de 4 KB (≈ 0,75 / 1 / 1,5 GB); o padrão de 4 GB de RAM para em ~340 MB
net.ipv4.tcp_mem = 196608 262144 393216
# cada WebSocket passa por ~2 entradas do conntrack (cliente → nginx, nginx → worker no Docker); 1 M ≈ 300 MB só se usadas
net.netfilter.nf_conntrack_max = 1048576
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
