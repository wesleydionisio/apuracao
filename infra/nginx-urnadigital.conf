# urnadigital.online na VPS da OVH: o nginx da máquina (que também serve o hub) termina o HTTPS e repassa
# o site para o Caddy da apuração (docker compose, só em 127.0.0.1:8090) e o /ws direto para os workers
# (127.0.0.1:3012 e 3013, ver infra/compose.ovh.yml). Instalado em /etc/nginx/sites-available/urnadigital.online.conf
# com link em sites-enabled. O domínio passa pela Cloudflare. Tudo aqui tem prefixo urna_ para não esbarrar no hub.

map $http_upgrade $urna_connection {
    default upgrade;
    ''      '';
}

# Só a Cloudflare pode dizer qual é o IP do visitante (os limites por IP da API e do WS usam o CF-Connecting-IP).
# Quem bate direto no IP da VPS com o cabeçalho inventado vira o próprio IP. Faixas: cloudflare.com/ips
geo $urna_from_cf {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map $urna_from_cf $urna_client_ip {
    1       $http_cf_connecting_ip;
    default $remote_addr;
}

upstream urna_caddy {
    server 127.0.0.1:8090;
    keepalive 64;
}

# workers WS: o de menos conexões recebe a próxima; caído, o nginx tenta o outro
upstream urna_ws {
    least_conn;
    server 127.0.0.1:3012 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3013 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    listen [::]:80;
    server_name urnadigital.online www.urnadigital.online;

    # desafio do Let's Encrypt (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://urnadigital.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name urnadigital.online www.urnadigital.online;

    ssl_certificate /etc/ssl/urnadigital/fullchain.pem;
    ssl_certificate_key /etc/ssl/urnadigital/privkey.pem;

    if ($host = www.urnadigital.online) {
        return 301 https://urnadigital.online$request_uri;
    }

    client_max_body_size 1m;
    # buffer de envio do TLS por conexão (padrão 16k): com dezenas de milhares de WebSockets é a maior parte da
    # memória do nginx; os frames do chat e do placar são pequenos
    ssl_buffer_size 4k;

    # valem para os dois locations (nenhum deles redefine proxy_set_header)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $urna_client_ip;
    proxy_set_header X-Real-IP $urna_client_ip;
    proxy_set_header X-Forwarded-For $urna_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    # WebSocket (/ws); nas outras rotas a conexão com o Caddy fica viva (keepalive)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $urna_connection;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;

    location = /ws {
        proxy_pass http://urna_ws;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://urna_caddy;
    }
}
