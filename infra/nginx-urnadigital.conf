# urnadigital.online na VPS da OVH: o nginx da máquina (que também serve o hub) termina o HTTPS e repassa
# tudo para o Caddy da apuração (docker compose, só em 127.0.0.1:8090). Instalado em
# /etc/nginx/sites-available/urnadigital.online.conf com link em sites-enabled. O domínio passa pela Cloudflare.

map $http_upgrade $urna_connection {
    default upgrade;
    ''      '';
}

upstream urna_caddy {
    server 127.0.0.1:8090;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name urnadigital.online www.urnadigital.online;

    # desafio do Let's Encrypt (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://urnadigital.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name urnadigital.online www.urnadigital.online;

    ssl_certificate /etc/ssl/urnadigital/fullchain.pem;
    ssl_certificate_key /etc/ssl/urnadigital/privkey.pem;

    if ($host = www.urnadigital.online) {
        return 301 https://urnadigital.online$request_uri;
    }

    client_max_body_size 1m;

    location / {
        proxy_pass http://urna_caddy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket do chat (/ws); nas outras rotas a conexão com o Caddy fica viva (keepalive)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $urna_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
